<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clash of Schmels — каталог ассетов</title><style>body{margin:32px;background:#e9e9d6;color:#425340;font:15px system-ui}h1{font-size:24px}a{color:#426c49}section{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}figure{margin:0;padding:16px;background:#f9f6e8;border-radius:12px;border:1px solid #cccdb4}img{width:100%;height:120px;object-fit:contain;background:repeating-conic-gradient(#d9dfcc 0% 25%,#e9ecdf 0% 50%) 50%/16px 16px}figcaption{overflow-wrap:anywhere;font-size:12px;margin-top:9px}button{padding:8px 12px;border:1px solid #9ca980;background:#f9f6e8;border-radius:8px;color:#425340;cursor:pointer}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:24px}h2{font-size:17px;margin-top:30px}code{font-size:11px}</style><header><h1>Clash of Schmels · ассеты</h1><a href="README.md">Как заменить</a><a href="manifest.json">manifest.json</a><button id="motion">Анимация: выкл.</button><a href="/bee">В игру</a></header><main></main><script>
let active=false;const all=[];fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()).then(pack=>{const groups={};for(const [key,a] of Object.entries(pack.assets)){const group=key.split('.')[0];if(!groups[group]){const h=document.createElement('h2');h.textContent=group;const s=document.createElement('section');document.querySelector('main').append(h,s);groups[group]=s;}const f=document.createElement('figure'),img=document.createElement('img'),c=document.createElement('figcaption'),link=document.createElement('a'),size=document.createElement('div');img.src=a.src+'?v='+pack.version;img.alt=key;link.href=a.src;link.textContent=key;size.textContent=a.width+'×'+a.height+' · '+a.src;c.append(link,size);f.append(img,c);groups[group].append(f);all.push({img,a,version:pack.version});}});document.querySelector('#motion').onclick=e=>{active=!active;e.target.textContent='Анимация: '+(active?'вкл.':'выкл.');all.forEach(({img,a,version})=>img.src=(active&&a.activeSrc?a.activeSrc:a.src)+'?v='+version)};
</script></html>
