<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" aria-hidden="true"><style>@keyframes rotate {
  to {
    transform: rotate(360deg);
  }
}
@keyframes piston {
  50% {
    transform: translateY(10px);
  }
}
@keyframes pump {
  0%,
  100% {
    transform: rotate(-9deg);
  }
  50% {
    transform: rotate(10deg);
  }
}
@keyframes steam {
  0% {
    transform: translateY(3px);
    opacity: 0;
  }
  30% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-17px);
    opacity: 0;
  }
}
@keyframes breathe {
  50% {
    opacity: 0.65;
  }
}
@keyframes wing {
  50% {
    transform: scaleY(0.45);
  }
}
@keyframes belt {
  to {
    stroke-dashoffset: -16;
  }
}
@keyframes hiveGlow {
  50% {
    fill: #b78035;
  }
}
@keyframes flowerSway {
  50% {
    transform: rotate(5deg);
  }
}
.gear {
  animation: rotate 4s linear infinite;
}
.wheel {
  animation: rotate 9s linear infinite;
}
.piston {
  animation: piston 1.8s ease-in-out infinite;
}
.pumpArm {
  animation: pump 2s ease-in-out infinite;
}
.steam {
  animation: steam 2.3s ease-out infinite;
}
.breathe {
  animation: breathe 2.6s ease-in-out infinite;
}
.wing {
  animation: wing 0.13s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.beltMotion {
  animation: belt 1s linear infinite;
}
.hiveGlow {
  animation: hiveGlow 2.4s ease-in-out infinite;
}
.flowerSway {
  animation: flowerSway 3.6s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="gold-sanctuary" x2=".6" y2="1"><stop stop-color="#f5df93"></stop><stop offset="1" stop-color="#d9ac58"></stop></linearGradient><linearGradient id="wax-sanctuary" x2=".8" y2="1"><stop stop-color="#e8c472"></stop><stop offset="1" stop-color="#ba8645"></stop></linearGradient></defs><ellipse cx="80" cy="130" rx="59" ry="16" fill="#34543a" opacity=".22"></ellipse><path d="m18 120 59 25 66-27-59-23Z" fill="#a39565"></path><path d="m18 115 59 25 66-27-59-22Z" fill="#c8bd86" stroke="#a99a69" stroke-width="1.5"></path><g><g><path d="M37.5 126v9q42.5 18 85 0v-9Z" fill="url(#wax-sanctuary)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="80" cy="126" rx="42.5" ry="17" fill="url(#gold-sanctuary)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g><g><path d="M37.5 115v9q42.5 18 85 0v-9Z" fill="url(#wax-sanctuary)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="80" cy="115" rx="42.5" ry="17" fill="url(#gold-sanctuary)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g></g><path d="M83 112V67m-2 13-22-15m24 28 23-17" stroke="#987c51" stroke-width="6"></path><ellipse cx="59" cy="62" rx="20" ry="12" fill="#8daf68" transform="rotate(25 59 62)"></ellipse><ellipse cx="96" cy="58" rx="22" ry="14" fill="#a7c379" transform="rotate(-32 96 58)"></ellipse><ellipse cx="106" cy="83" rx="19" ry="11" fill="#759d60"></ellipse><path d="m48 99 13 15m49-2 12-13" stroke="#a2b79b" stroke-width="8"></path></svg>