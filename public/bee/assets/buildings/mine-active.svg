<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" aria-hidden="true"><style>@keyframes rotate {
  to {
    transform: rotate(360deg);
  }
}
@keyframes piston {
  50% {
    transform: translateY(10px);
  }
}
@keyframes pump {
  0%,
  100% {
    transform: rotate(-9deg);
  }
  50% {
    transform: rotate(10deg);
  }
}
@keyframes steam {
  0% {
    transform: translateY(3px);
    opacity: 0;
  }
  30% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-17px);
    opacity: 0;
  }
}
@keyframes breathe {
  50% {
    opacity: 0.65;
  }
}
@keyframes wing {
  50% {
    transform: scaleY(0.45);
  }
}
@keyframes belt {
  to {
    stroke-dashoffset: -16;
  }
}
@keyframes hiveGlow {
  50% {
    fill: #b78035;
  }
}
@keyframes flowerSway {
  50% {
    transform: rotate(5deg);
  }
}
.gear {
  animation: rotate 4s linear infinite;
}
.wheel {
  animation: rotate 9s linear infinite;
}
.piston {
  animation: piston 1.8s ease-in-out infinite;
}
.pumpArm {
  animation: pump 2s ease-in-out infinite;
}
.steam {
  animation: steam 2.3s ease-out infinite;
}
.breathe {
  animation: breathe 2.6s ease-in-out infinite;
}
.wing {
  animation: wing 0.13s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.beltMotion {
  animation: belt 1s linear infinite;
}
.hiveGlow {
  animation: hiveGlow 2.4s ease-in-out infinite;
}
.flowerSway {
  animation: flowerSway 3.6s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="gold-mine" x2=".6" y2="1"><stop stop-color="#f5df93"></stop><stop offset="1" stop-color="#d9ac58"></stop></linearGradient><linearGradient id="wax-mine" x2=".8" y2="1"><stop stop-color="#e8c472"></stop><stop offset="1" stop-color="#ba8645"></stop></linearGradient></defs><ellipse cx="80" cy="130" rx="59" ry="16" fill="#34543a" opacity=".22"></ellipse><path d="m18 120 59 25 66-27-59-23Z" fill="#a39565"></path><path d="m18 115 59 25 66-27-59-22Z" fill="#c8bd86" stroke="#a99a69" stroke-width="1.5"></path><path d="m26 119 20-32 30 11 17-21 33 24 10 30Z" fill="#8c9c8b" stroke="#657a68" stroke-width="3"></path><path d="M52 104V47h57v68" stroke="#b49764" stroke-width="8" fill="none"></path><g class="piston"><path d="M81 58v40m-9-31 18 7m-18 2 18 7m-18 2 18 7" stroke="#b5c6ac" stroke-width="7"></path><path d="m73 94 8 14 8-14" fill="#698575"></path></g><g class="gear" style="transform-origin:112px 63px"><circle cx="112" cy="63" r="15" fill="#8b6650" stroke="#d5b476" stroke-width="5"></circle><path d="M112 44v8" stroke="#b58b58" stroke-width="6" transform="rotate(0 112 63)"></path><path d="M112 44v8" stroke="#b58b58" stroke-width="6" transform="rotate(45 112 63)"></path><path d="M112 44v8" stroke="#b58b58" stroke-width="6" transform="rotate(90 112 63)"></path><path d="M112 44v8" stroke="#b58b58" stroke-width="6" transform="rotate(135 112 63)"></path><path d="M112 44v8" stroke="#b58b58" stroke-width="6" transform="rotate(180 112 63)"></path><path d="M112 44v8" stroke="#b58b58" stroke-width="6" transform="rotate(225 112 63)"></path><path d="M112 44v8" stroke="#b58b58" stroke-width="6" transform="rotate(270 112 63)"></path><path d="M112 44v8" stroke="#b58b58" stroke-width="6" transform="rotate(315 112 63)"></path><circle cx="112" cy="63" r="7.199999999999999" fill="#d0d6b2"></circle><circle cx="112" cy="63" r="4" fill="#715343"></circle></g></svg>