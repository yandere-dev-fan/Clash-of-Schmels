<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" aria-hidden="true"><style>@keyframes rotate {
  to {
    transform: rotate(360deg);
  }
}
@keyframes piston {
  50% {
    transform: translateY(10px);
  }
}
@keyframes pump {
  0%,
  100% {
    transform: rotate(-9deg);
  }
  50% {
    transform: rotate(10deg);
  }
}
@keyframes steam {
  0% {
    transform: translateY(3px);
    opacity: 0;
  }
  30% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-17px);
    opacity: 0;
  }
}
@keyframes breathe {
  50% {
    opacity: 0.65;
  }
}
@keyframes wing {
  50% {
    transform: scaleY(0.45);
  }
}
@keyframes belt {
  to {
    stroke-dashoffset: -16;
  }
}
@keyframes hiveGlow {
  50% {
    fill: #b78035;
  }
}
@keyframes flowerSway {
  50% {
    transform: rotate(5deg);
  }
}
.gear {
  animation: rotate 4s linear infinite;
}
.wheel {
  animation: rotate 9s linear infinite;
}
.piston {
  animation: piston 1.8s ease-in-out infinite;
}
.pumpArm {
  animation: pump 2s ease-in-out infinite;
}
.steam {
  animation: steam 2.3s ease-out infinite;
}
.breathe {
  animation: breathe 2.6s ease-in-out infinite;
}
.wing {
  animation: wing 0.13s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.beltMotion {
  animation: belt 1s linear infinite;
}
.hiveGlow {
  animation: hiveGlow 2.4s ease-in-out infinite;
}
.flowerSway {
  animation: flowerSway 3.6s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="gold-nursery" x2=".6" y2="1"><stop stop-color="#f5df93"></stop><stop offset="1" stop-color="#d9ac58"></stop></linearGradient><linearGradient id="wax-nursery" x2=".8" y2="1"><stop stop-color="#e8c472"></stop><stop offset="1" stop-color="#ba8645"></stop></linearGradient></defs><ellipse cx="80" cy="130" rx="59" ry="16" fill="#34543a" opacity=".22"></ellipse><path d="m18 120 59 25 66-27-59-23Z" fill="#a39565"></path><path d="m18 115 59 25 66-27-59-22Z" fill="#c8bd86" stroke="#a99a69" stroke-width="1.5"></path><g><g><path d="M28.5 124v9q51.5 18 103 0v-9Z" fill="url(#wax-nursery)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="80" cy="124" rx="51.5" ry="20.6" fill="url(#gold-nursery)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g><g><path d="M28.5 113v9q51.5 18 103 0v-9Z" fill="url(#wax-nursery)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="80" cy="113" rx="51.5" ry="20.6" fill="url(#gold-nursery)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g></g><path d="M29 100q0-60 52-61t51 61" fill="#e6c777" stroke="#af8c4c" stroke-width="4"></path><g><path d="M59 63l13.92 8v16l-13.92 8-13.92-8v-16Z" fill="#cb9550" stroke="#b0844b" stroke-width="2"></path><ellipse cx="59" cy="80" rx="8" ry="11" fill="#fff3c8"></ellipse></g><g><path d="M80 49l13.92 8v16l-13.92 8-13.92-8v-16Z" fill="#cb9550" stroke="#b0844b" stroke-width="2"></path><ellipse cx="80" cy="66" rx="8" ry="11" fill="#fff3c8"></ellipse></g><g><path d="M102 63l13.92 8v16l-13.92 8-13.92-8v-16Z" fill="#cb9550" stroke="#b0844b" stroke-width="2"></path><ellipse cx="102" cy="80" rx="8" ry="11" fill="#fff3c8"></ellipse></g><g><path d="M69 85l13.92 8v16l-13.92 8-13.92-8v-16Z" fill="#cb9550" stroke="#b0844b" stroke-width="2"></path><ellipse cx="69" cy="102" rx="8" ry="11" fill="#fff3c8"></ellipse></g><g><path d="M92 85l13.92 8v16l-13.92 8-13.92-8v-16Z" fill="#cb9550" stroke="#b0844b" stroke-width="2"></path><ellipse cx="92" cy="102" rx="8" ry="11" fill="#fff3c8"></ellipse></g><path d="M40 59q37-40 77 2" stroke="#97ae70" stroke-width="8" fill="none"></path></svg>