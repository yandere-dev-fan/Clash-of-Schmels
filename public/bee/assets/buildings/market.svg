<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" aria-hidden="true"><style>@keyframes rotate {
  to {
    transform: rotate(360deg);
  }
}
@keyframes piston {
  50% {
    transform: translateY(10px);
  }
}
@keyframes pump {
  0%,
  100% {
    transform: rotate(-9deg);
  }
  50% {
    transform: rotate(10deg);
  }
}
@keyframes steam {
  0% {
    transform: translateY(3px);
    opacity: 0;
  }
  30% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-17px);
    opacity: 0;
  }
}
@keyframes breathe {
  50% {
    opacity: 0.65;
  }
}
@keyframes wing {
  50% {
    transform: scaleY(0.45);
  }
}
@keyframes belt {
  to {
    stroke-dashoffset: -16;
  }
}
@keyframes hiveGlow {
  50% {
    fill: #b78035;
  }
}
@keyframes flowerSway {
  50% {
    transform: rotate(5deg);
  }
}
.gear {
  animation: rotate 4s linear infinite;
}
.wheel {
  animation: rotate 9s linear infinite;
}
.piston {
  animation: piston 1.8s ease-in-out infinite;
}
.pumpArm {
  animation: pump 2s ease-in-out infinite;
}
.steam {
  animation: steam 2.3s ease-out infinite;
}
.breathe {
  animation: breathe 2.6s ease-in-out infinite;
}
.wing {
  animation: wing 0.13s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.beltMotion {
  animation: belt 1s linear infinite;
}
.hiveGlow {
  animation: hiveGlow 2.4s ease-in-out infinite;
}
.flowerSway {
  animation: flowerSway 3.6s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="gold-market" x2=".6" y2="1"><stop stop-color="#f5df93"></stop><stop offset="1" stop-color="#d9ac58"></stop></linearGradient><linearGradient id="wax-market" x2=".8" y2="1"><stop stop-color="#e8c472"></stop><stop offset="1" stop-color="#ba8645"></stop></linearGradient></defs><ellipse cx="80" cy="130" rx="59" ry="16" fill="#34543a" opacity=".22"></ellipse><path d="m18 120 59 25 66-27-59-23Z" fill="#a39565"></path><path d="m18 115 59 25 66-27-59-22Z" fill="#c8bd86" stroke="#a99a69" stroke-width="1.5"></path><g><g><path d="M30.5 124v9q49.5 18 99 0v-9Z" fill="url(#wax-market)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="80" cy="124" rx="49.5" ry="19.8" fill="url(#gold-market)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g><g><path d="M30.5 113v9q49.5 18 99 0v-9Z" fill="url(#wax-market)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="80" cy="113" rx="49.5" ry="19.8" fill="url(#gold-market)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g><g><path d="M30.5 102v9q49.5 18 99 0v-9Z" fill="url(#wax-market)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="80" cy="102" rx="49.5" ry="19.8" fill="url(#gold-market)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g></g><path d="M46 99V64m69 34V62" stroke="#9e8253" stroke-width="5"></path><path d="m42 63 38 12 39-13-8-15-31 13-30-13Z" fill="#a5b87b"></path><path d="m54 66 5-15m14 21 3-15m17 14-2-15m17 10-5-15" stroke="#e9db98" stroke-width="6"></path><path d="M80 96l13.05 7.5v15l-13.05 7.5-13.05-7.5v-15Z" fill="#e9c472" stroke="#b0844b" stroke-width="2"></path><path d="m75 108 5-7 6 8-6 9Z" fill="#b08643"></path></svg>