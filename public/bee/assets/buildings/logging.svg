<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" aria-hidden="true"><style>@keyframes rotate {
  to {
    transform: rotate(360deg);
  }
}
@keyframes piston {
  50% {
    transform: translateY(10px);
  }
}
@keyframes pump {
  0%,
  100% {
    transform: rotate(-9deg);
  }
  50% {
    transform: rotate(10deg);
  }
}
@keyframes steam {
  0% {
    transform: translateY(3px);
    opacity: 0;
  }
  30% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-17px);
    opacity: 0;
  }
}
@keyframes breathe {
  50% {
    opacity: 0.65;
  }
}
@keyframes wing {
  50% {
    transform: scaleY(0.45);
  }
}
@keyframes belt {
  to {
    stroke-dashoffset: -16;
  }
}
@keyframes hiveGlow {
  50% {
    fill: #b78035;
  }
}
@keyframes flowerSway {
  50% {
    transform: rotate(5deg);
  }
}
.gear {
  animation: rotate 4s linear infinite;
}
.wheel {
  animation: rotate 9s linear infinite;
}
.piston {
  animation: piston 1.8s ease-in-out infinite;
}
.pumpArm {
  animation: pump 2s ease-in-out infinite;
}
.steam {
  animation: steam 2.3s ease-out infinite;
}
.breathe {
  animation: breathe 2.6s ease-in-out infinite;
}
.wing {
  animation: wing 0.13s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.beltMotion {
  animation: belt 1s linear infinite;
}
.hiveGlow {
  animation: hiveGlow 2.4s ease-in-out infinite;
}
.flowerSway {
  animation: flowerSway 3.6s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="gold-logging" x2=".6" y2="1"><stop stop-color="#f5df93"></stop><stop offset="1" stop-color="#d9ac58"></stop></linearGradient><linearGradient id="wax-logging" x2=".8" y2="1"><stop stop-color="#e8c472"></stop><stop offset="1" stop-color="#ba8645"></stop></linearGradient></defs><ellipse cx="80" cy="130" rx="59" ry="16" fill="#34543a" opacity=".22"></ellipse><path d="m18 120 59 25 66-27-59-23Z" fill="#a39565"></path><path d="m18 115 59 25 66-27-59-22Z" fill="#c8bd86" stroke="#a99a69" stroke-width="1.5"></path><g><path d="m27 106 35-17 21 13-37 18Z" fill="#b98754"></path><path d="m28 117 34-17 22 13-38 19Z" fill="#926844"></path><ellipse cx="35" cy="115" rx="9" ry="13" fill="#e4bd82" stroke="#a27849" stroke-width="2"></ellipse><ellipse cx="35" cy="115" rx="4" ry="7" fill="none" stroke="#b58954"></ellipse></g><g><g><path d="M86.5 109v9q20.5 18 41 0v-9Z" fill="url(#wax-logging)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="107" cy="109" rx="20.5" ry="8.200000000000001" fill="url(#gold-logging)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g><g><path d="M86.5 98v9q20.5 18 41 0v-9Z" fill="url(#wax-logging)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="107" cy="98" rx="20.5" ry="8.200000000000001" fill="url(#gold-logging)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g></g><path d="M100 96V53m-20 11 39-18" stroke="#a18553" stroke-width="7"></path><path d="m81 63 40-18v16L81 79Z" fill="#c8af6c"></path><path d="m94 47 11-19 11 7-12 19" fill="#99ac9e" stroke="#667b6c" stroke-width="2"></path></svg>