<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" aria-hidden="true"><style>@keyframes rotate {
  to {
    transform: rotate(360deg);
  }
}
@keyframes piston {
  50% {
    transform: translateY(10px);
  }
}
@keyframes pump {
  0%,
  100% {
    transform: rotate(-9deg);
  }
  50% {
    transform: rotate(10deg);
  }
}
@keyframes steam {
  0% {
    transform: translateY(3px);
    opacity: 0;
  }
  30% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-17px);
    opacity: 0;
  }
}
@keyframes breathe {
  50% {
    opacity: 0.65;
  }
}
@keyframes wing {
  50% {
    transform: scaleY(0.45);
  }
}
@keyframes belt {
  to {
    stroke-dashoffset: -16;
  }
}
@keyframes hiveGlow {
  50% {
    fill: #b78035;
  }
}
@keyframes flowerSway {
  50% {
    transform: rotate(5deg);
  }
}
.gear {
  animation: rotate 4s linear infinite;
}
.wheel {
  animation: rotate 9s linear infinite;
}
.piston {
  animation: piston 1.8s ease-in-out infinite;
}
.pumpArm {
  animation: pump 2s ease-in-out infinite;
}
.steam {
  animation: steam 2.3s ease-out infinite;
}
.breathe {
  animation: breathe 2.6s ease-in-out infinite;
}
.wing {
  animation: wing 0.13s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.beltMotion {
  animation: belt 1s linear infinite;
}
.hiveGlow {
  animation: hiveGlow 2.4s ease-in-out infinite;
}
.flowerSway {
  animation: flowerSway 3.6s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="gold-dynamo" x2=".6" y2="1"><stop stop-color="#f5df93"></stop><stop offset="1" stop-color="#d9ac58"></stop></linearGradient><linearGradient id="wax-dynamo" x2=".8" y2="1"><stop stop-color="#e8c472"></stop><stop offset="1" stop-color="#ba8645"></stop></linearGradient></defs><ellipse cx="80" cy="130" rx="59" ry="16" fill="#34543a" opacity=".22"></ellipse><path d="m18 120 59 25 66-27-59-23Z" fill="#a39565"></path><path d="m18 115 59 25 66-27-59-22Z" fill="#c8bd86" stroke="#a99a69" stroke-width="1.5"></path><g><g><path d="M36.5 125v9q41.5 18 83 0v-9Z" fill="url(#wax-dynamo)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="78" cy="125" rx="41.5" ry="16.6" fill="url(#gold-dynamo)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g><g><path d="M36.5 114v9q41.5 18 83 0v-9Z" fill="url(#wax-dynamo)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="78" cy="114" rx="41.5" ry="16.6" fill="url(#gold-dynamo)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g></g><path d="m45 99 17-39 49 20-17 42Z" fill="#abc0a2" stroke="#728b77" stroke-width="3"></path><path d="m64 64 -14 37" stroke="#b78459" stroke-width="4"></path><path d="m70 66 -14 37" stroke="#b78459" stroke-width="4"></path><path d="m76 68 -14 37" stroke="#b78459" stroke-width="4"></path><path d="m82 70 -14 37" stroke="#b78459" stroke-width="4"></path><path d="m88 72 -14 37" stroke="#b78459" stroke-width="4"></path><path d="m94 74 -14 37" stroke="#b78459" stroke-width="4"></path><g style="transform-origin:49px 101px"><circle cx="49" cy="101" r="23" fill="#8b6650" stroke="#d5b476" stroke-width="5"></circle><path d="M49 74v8" stroke="#b58b58" stroke-width="6" transform="rotate(0 49 101)"></path><path d="M49 74v8" stroke="#b58b58" stroke-width="6" transform="rotate(45 49 101)"></path><path d="M49 74v8" stroke="#b58b58" stroke-width="6" transform="rotate(90 49 101)"></path><path d="M49 74v8" stroke="#b58b58" stroke-w