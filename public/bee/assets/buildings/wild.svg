<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" aria-hidden="true"><style>@keyframes rotate {
  to {
    transform: rotate(360deg);
  }
}
@keyframes piston {
  50% {
    transform: translateY(10px);
  }
}
@keyframes pump {
  0%,
  100% {
    transform: rotate(-9deg);
  }
  50% {
    transform: rotate(10deg);
  }
}
@keyframes steam {
  0% {
    transform: translateY(3px);
    opacity: 0;
  }
  30% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-17px);
    opacity: 0;
  }
}
@keyframes breathe {
  50% {
    opacity: 0.65;
  }
}
@keyframes wing {
  50% {
    transform: scaleY(0.45);
  }
}
@keyframes belt {
  to {
    stroke-dashoffset: -16;
  }
}
@keyframes hiveGlow {
  50% {
    fill: #b78035;
  }
}
@keyframes flowerSway {
  50% {
    transform: rotate(5deg);
  }
}
.gear {
  animation: rotate 4s linear infinite;
}
.wheel {
  animation: rotate 9s linear infinite;
}
.piston {
  animation: piston 1.8s ease-in-out infinite;
}
.pumpArm {
  animation: pump 2s ease-in-out infinite;
}
.steam {
  animation: steam 2.3s ease-out infinite;
}
.breathe {
  animation: breathe 2.6s ease-in-out infinite;
}
.wing {
  animation: wing 0.13s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.beltMotion {
  animation: belt 1s linear infinite;
}
.hiveGlow {
  animation: hiveGlow 2.4s ease-in-out infinite;
}
.flowerSway {
  animation: flowerSway 3.6s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="gold-wild" x2=".6" y2="1"><stop stop-color="#f5df93"></stop><stop offset="1" stop-color="#d9ac58"></stop></linearGradient><linearGradient id="wax-wild" x2=".8" y2="1"><stop stop-color="#e8c472"></stop><stop offset="1" stop-color="#ba8645"></stop></linearGradient></defs><ellipse cx="80" cy="130" rx="59" ry="16" fill="#34543a" opacity=".22"></ellipse><path d="m18 120 59 25 66-27-59-23Z" fill="#a39565"></path><path d="m18 115 59 25 66-27-59-22Z" fill="#c8bd86" stroke="#a99a69" stroke-width="1.5"></path><g><g><path d="M33 119v9q45 18 90 0v-9Z" fill="url(#wax-wild)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="78" cy="119" rx="45" ry="18" fill="url(#gold-wild)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g><g><path d="M33 108v9q45 18 90 0v-9Z" fill="url(#wax-wild)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="78" cy="108" rx="45" ry="18" fill="url(#gold-wild)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g><g><path d="M33 97v9q45 18 90 0v-9Z" fill="url(#wax-wild)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="78" cy="97" rx="45" ry="18" fill="url(#gold-wild)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g><g><path d="M33 86v9q45 18 90 0v-9Z" fill="url(#wax-wild)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="78" cy="86" rx="45" ry="18" fill="url(#gold-wild)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g><g><path d="M33 75v9q45 18 90 0v-9Z" fill="url(#wax-wild)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="78" cy="75" rx="45" ry="18" fill="url(#gold-wild)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g><g><path d="M33 64v9q45 18 90 0v-9Z" fill="url(#wax-wild)" stroke="#ac793d" stroke-width="1.5"></path><ellipse cx="78" cy="64" rx="45" ry="18" fill="url(#gold-wild)" stroke="#bc8e48" stroke-width="1.4"></ellipse></g></g><path d="m51 40 11 10 15-22 15 22 14-9-6 20H57Z" fill="#ffdc70" stroke="#b48a45" stroke-width="2"></path><ellipse cx="80" cy="118" rx="15" ry="10" fill="#5d4636"></ellipse><path d="M66 118q14-10 28 0" stroke="#f8cb68" stroke-width="3" fill="none"></path><path d="m24 112 8-16m-1 9-10-5m12-2 7-7" stroke="#70965b" stroke-width="4"></path></svg>