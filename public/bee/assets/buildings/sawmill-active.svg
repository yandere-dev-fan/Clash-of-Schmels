<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" aria-hidden="true"><style>@keyframes rotate {
  to {
    transform: rotate(360deg);
  }
}
@keyframes piston {
  50% {
    transform: translateY(10px);
  }
}
@keyframes pump {
  0%,
  100% {
    transform: rotate(-9deg);
  }
  50% {
    transform: rotate(10deg);
  }
}
@keyframes steam {
  0% {
    transform: translateY(3px);
    opacity: 0;
  }
  30% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-17px);
    opacity: 0;
  }
}
@keyframes breathe {
  50% {
    opacity: 0.65;
  }
}
@keyframes wing {
  50% {
    transform: scaleY(0.45);
  }
}
@keyframes belt {
  to {
    stroke-dashoffset: -16;
  }
}
@keyframes hiveGlow {
  50% {
    fill: #b78035;
  }
}
@keyframes flowerSway {
  50% {
    transform: rotate(5deg);
  }
}
.gear {
  animation: rotate 4s linear infinite;
}
.wheel {
  animation: rotate 9s linear infinite;
}
.piston {
  animation: piston 1.8s ease-in-out infinite;
}
.pumpArm {
  animation: pump 2s ease-in-out infinite;
}
.steam {
  animation: steam 2.3s ease-out infinite;
}
.breathe {
  animation: breathe 2.6s ease-in-out infinite;
}
.wing {
  animation: wing 0.13s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.beltMotion {
  animation: belt 1s linear infinite;
}
.hiveGlow {
  animation: hiveGlow 2.4s ease-in-out infinite;
}
.flowerSway {
  animation: flowerSway 3.6s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="gold-sawmill" x2=".6" y2="1"><stop stop-color="#f5df93"></stop><stop offset="1" stop-color="#d9ac58"></stop></linearGradient><linearGradient id="wax-sawmill" x2=".8" y2="1"><stop stop-color="#e8c472"></stop><stop offset="1" stop-color="#ba8645"></stop></linearGradient></defs><ellipse cx="80" cy="130" rx="59" ry="16" fill="#34543a" opacity=".22"></ellipse><path d="m18 120 59 25 66-27-59-23Z" fill="#a39565"></path><path d="m18 115 59 25 66-27-59-22Z" fill="#c8bd86" stroke="#a99a69" stroke-width="1.5"></path><g><path d="m27 106 35-17 21 13-37 18Z" fill="#b98754"></path><path d="m28 117 34-17 22 13-38 19Z" fill="#926844"></path><ellipse cx="35" cy="115" rx="9" ry="13" fill="#e4bd82" stroke="#a27849" stroke-width="2"></ellipse><ellipse cx="35" cy="115" rx="4" ry="7" fill="none" stroke="#b58954"></ellipse></g><path d="m57 101 38 17 35-18-35-17Z" fill="#d5b979"></path><path d="M69 101v31m44-26v20" stroke="#92734a" stroke-width="7"></path><g class="gear" style="transform-origin:96px 90px"><circle cx="96" cy="90" r="27" fill="#8b6650" stroke="#d5b476" stroke-width="5"></circle><path d="M96 59v8" stroke="#b58b58" stroke-width="6" transform="rotate(0 96 90)"></path><path d="M96 59v8" stroke="#b58b58" stroke-width="6" transform="rotate(45 96 90)"></path><path d="M96 59v8" stroke="#b58b58" stroke-width="6" transform="rotate(90 96 90)"></path><path d="M96 59v8" stroke="#b58b58" stroke-width="6" transform="rotate(135 96 90)"></path><path d="M96 59v8" stroke="#b58b58" stroke-width="6" transform="rotate(180 96 90)"></path><path d="M96 59v8" stroke="#b58b58" stroke-width="6" transform="rotate(225 96 90)"></path><path d="M96 59v8" stroke="#b58b58" stroke-width="6" transform="rotate(270 96 90)"></path><path d="M96 59v8" stroke="#b58b58" stroke-width="6" transform="rotate(315 96 90)"></path><circle cx="96" cy="90" r="12.959999999999999" fill="#d0d6b2"></circle><circle cx="96" cy="90" r="4" fill="#715343"></circle></g><path d="m64 80 37-18 13 8-35 18Z" fill="#c39b65"></path></svg>