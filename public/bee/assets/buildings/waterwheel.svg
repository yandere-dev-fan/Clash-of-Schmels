<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" aria-hidden="true"><style>@keyframes rotate {
  to {
    transform: rotate(360deg);
  }
}
@keyframes piston {
  50% {
    transform: translateY(10px);
  }
}
@keyframes pump {
  0%,
  100% {
    transform: rotate(-9deg);
  }
  50% {
    transform: rotate(10deg);
  }
}
@keyframes steam {
  0% {
    transform: translateY(3px);
    opacity: 0;
  }
  30% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-17px);
    opacity: 0;
  }
}
@keyframes breathe {
  50% {
    opacity: 0.65;
  }
}
@keyframes wing {
  50% {
    transform: scaleY(0.45);
  }
}
@keyframes belt {
  to {
    stroke-dashoffset: -16;
  }
}
@keyframes hiveGlow {
  50% {
    fill: #b78035;
  }
}
@keyframes flowerSway {
  50% {
    transform: rotate(5deg);
  }
}
.gear {
  animation: rotate 4s linear infinite;
}
.wheel {
  animation: rotate 9s linear infinite;
}
.piston {
  animation: piston 1.8s ease-in-out infinite;
}
.pumpArm {
  animation: pump 2s ease-in-out infinite;
}
.steam {
  animation: steam 2.3s ease-out infinite;
}
.breathe {
  animation: breathe 2.6s ease-in-out infinite;
}
.wing {
  animation: wing 0.13s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.beltMotion {
  animation: belt 1s linear infinite;
}
.hiveGlow {
  animation: hiveGlow 2.4s ease-in-out infinite;
}
.flowerSway {
  animation: flowerSway 3.6s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="gold-waterwheel" x2=".6" y2="1"><stop stop-color="#f5df93"></stop><stop offset="1" stop-color="#d9ac58"></stop></linearGradient><linearGradient id="wax-waterwheel" x2=".8" y2="1"><stop stop-color="#e8c472"></stop><stop offset="1" stop-color="#ba8645"></stop></linearGradient></defs><ellipse cx="80" cy="130" rx="59" ry="16" fill="#34543a" opacity=".22"></ellipse><path d="m18 120 59 25 66-27-59-23Z" fill="#a39565"></path><path d="m18 115 59 25 66-27-59-22Z" fill="#c8bd86" stroke="#a99a69" stroke-width="1.5"></path><path d="m30 121 104 0-14 12H40Z" fill="#897753"></path><path d="M71 127V54m23 76V52" stroke="#a08454" stroke-width="8"></path><g style="transform-origin:80px 82px"><ellipse cx="80" cy="82" rx="39" ry="42" fill="#816542" stroke="#c29b62" stroke-width="7"></ellipse><ellipse cx="80" cy="82" rx="30" ry="33" fill="#9baf93"></ellipse><path d="M80 40v84m-7-81h14" stroke="#c4a46f" stroke-width="5" transform="rotate(0 80 82)"></path><path d="M80 40v84m-7-81h14" stroke="#c4a46f" stroke-width="5" transform="rotate(36 80 82)"></path><path d="M80 40v84m-7-81h14" stroke="#c4a46f" stroke-width="5" transform="rotate(72 80 82)"></path><path d="M80 40v84m-7-81h14" stroke="#c4a46f" stroke-width="5" transform="rotate(108 80 82)"></path><path d="M80 40v84m-7-81h14" stroke="#c4a46f" stroke-width="5" transform="rotate(144 80 82)"></path><path d="M80 40v84m-7-81h14" stroke="#c4a46f" stroke-width="5" transform="rotate(180 80 82)"></path><path d="M80 40v84m-7-81h14" stroke="#c4a46f" stroke-width="5" transform="rotate(216 80 82)"></path><path d="M80 40v84m-7-81h14" stroke="#c4a46f" stroke-width="5" transform="rotate(252 80 82)"></path><path d="M80 40v84m-7-81h14" stroke="#c4a46f" stroke-width="5" transform="rotate(288 80 82)"></path><path d="M80 40v84m-7-81h14" stroke="#c4a46f" stroke-width="5" transform="rotate(324 80 82)"></path></g><circle cx="80" cy="82" r="9" fill="#d2bc80" stroke="#856a45" stroke-width="3"></circle></svg>